[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shramik-backend"
version = "0.1.0"
description = "FastAPI backend for Shramik.ai"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.116.0",
  "pydantic-settings>=2.10.0",
  "uvicorn>=0.35.0",
  "openai>=1.0.0",
  "httpx>=0.28.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0"
]
